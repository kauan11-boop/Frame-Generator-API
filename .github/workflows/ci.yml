name: Static checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: node --check server.js && node --check dashboard/app.js
      - name: Validar JSON
        run: node -e "for (const f of ['package.json', 'dashboard/data/snapshot.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
