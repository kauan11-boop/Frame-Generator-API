<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frame-Generator-API — Dashboard</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="./index.html" class="brand-link">Frame-Generator-API</a>
      <span class="sub">Dashboard • API estática em <code>src/api/v1</code></span>
    </div>
    <div class="topbar-right">
      <div class="status" id="status-pill">carregando…</div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Seções">
    <button data-tab="overview" class="active">Visão geral</button>
    <button data-tab="models">Modelos & GGUF</button>
    <button data-tab="frames">Geração de quadros</button>
    <button data-tab="packages">Pacotes</button>
    <button data-tab="commands">Comandos JSON</button>
    <button data-tab="repack">Repack</button>
    <button data-tab="adapters">Adaptadores</button>
    <button data-tab="integration">Integração (IA)</button>
  </nav>

  <main class="container">
    <section id="tab-overview" class="tab active"></section>
    <section id="tab-models" class="tab"></section>
    <section id="tab-frames" class="tab"></section>
    <section id="tab-packages" class="tab"></section>
    <section id="tab-commands" class="tab"></section>
    <section id="tab-repack" class="tab"></section>
    <section id="tab-adapters" class="tab"></section>
    <section id="tab-integration" class="tab"></section>
  </main>

  <footer class="footer">
    <span id="meta"></span>
    <span>API base: <code id="base"></code></span>
  </footer>

  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
