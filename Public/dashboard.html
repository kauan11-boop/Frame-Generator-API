<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Frame-Generator-API</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111827'/%3E%3Cpath d='M18 20h28v6H18zm0 9h28v6H18zm0 9h18v6H18z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/main.css" />
  <style>
    .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
    .form-row input,.form-row select{padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;font:13px var(--sans)}
    .form-row label{font-size:13px;color:var(--muted)}
    .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
    .section-note{font-size:13px;color:var(--muted);margin:6px 0 0}
    .chart-wrap{display:flex;flex-direction:column;gap:8px}
    .chart-title{font-size:12px;color:var(--muted);font-weight:500}
    .chart-legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--muted)}
    .legend-item{display:inline-flex;align-items:center;gap:6px}
    .legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
    .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .code-block{position:relative}
    .copy-btn{position:absolute;top:8px;right:8px;font-size:12px;padding:4px 8px}
    .integration-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  </style>
</head>
<body class="dashboard-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="./index.html" class="brand-link">Frame-Generator-API</a>
        <span class="sub">Informações e integração</span>
      </div>

      <nav class="tabs sidebar-nav" id="tabs" aria-label="Seções">
        <button data-tab="overview" class="active"><span>Visão geral</span></button>
        <button data-tab="integration"><span>Integração</span></button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-row"><span class="label">Status</span><div class="status" id="status-pill">carregando…</div></div>
        <a class="sidebar-link" href="../configs/api.json">Contrato API</a>
      </div>
    </aside>

    <div class="main-area">
      <header class="main-header">
        <div>
          <h1 class="page-title">Frame-Generator-API</h1>
          <p class="sub">Gráficos de informações do sistema e integração de APIs/informações em modelos de IA e projetos</p>
        </div>
      </header>

      <main class="container">
        <section id="tab-overview" class="tab active"></section>
        <section id="tab-integration" class="tab"></section>
      </main>

      <footer class="footer">
        <span id="meta"></span>
        <span>Modo: <code id="mode-pill">—</code> · Base: <code id="base"></code></span>
      </footer>
    </div>
  </div>

  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
