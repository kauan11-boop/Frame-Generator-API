<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frame-Generator-API — Integração React (executa no navegador)</title>
  <meta name="description" content="Demonstração React integrada, executada diretamente no navegador (ESM via CDN), consumindo configs/payload do Frame-Generator-API." />
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #111827; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    h2 { margin: 0 0 8px; font-size: 1rem; }
    header p { margin: 0 0 16px; color: #4b5563; max-width: 75ch; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input { flex: 1 1 320px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
    button { padding: 10px 14px; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 8px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    pre { background: #0f172a; color: #e5e7eb; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 360px; }
    code { background: #f1f4f8; border: 1px solid #e5e7eb; padding: 1px 6px; border-radius: 6px; }
    .muted { color: #4b5563; }
    .error { color: #991b1b; background: #fef2f2; border: 1px solid #fca5a5; padding: 8px 10px; border-radius: 8px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #4b5563; margin-bottom: 4px; }
    .notice { padding: 10px 12px; border: 1px solid #93c5fd; background: #eff6ff; color: #1e40af; border-radius: 10px; font-size: 0.9375rem; }
    footer { margin-top: 8px; font-size: 0.875rem; }
    .topbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    a.btn-link { display:inline-flex; align-items:center; padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; color:#111827; text-decoration:none; background:#fff; font-size:0.875rem; font-weight:600; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useEffect, useState } from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';

    const e = React.createElement;

    function joinUrl(base, path) {
      const b = String(base || '').endsWith('/') ? String(base || '') : String(base || '') + '/';
      return new URL(String(path || '').replace(/^\//, ''), b).toString();
    }

    function defaultSiteBase() {
      try { return new URL('../', window.location.href).toString(); } catch { return './'; }
    }

    function App() {
      const [siteBase, setSiteBase] = useState(defaultSiteBase());
      const [apiConfig, setApiConfig] = useState(null);
      const [settings, setSettings] = useState(null);
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(false);

      async function load(base) {
        const target = base != null ? base : siteBase;
        setLoading(true);
        setError(null);
        try {
          const [apiRes, settingsRes] = await Promise.all([
            fetch(joinUrl(target, 'configs/api.json'), { cache: 'no-store' }),
            fetch(joinUrl(target, 'configs/settings.json'), { cache: 'no-store' }),
          ]);
          if (!apiRes.ok) throw new Error(`Falha ao carregar configs/api.json (${apiRes.status})`);
          if (!settingsRes.ok) throw new Error(`Falha ao carregar configs/settings.json (${settingsRes.status})`);
          setApiConfig(await apiRes.json());
          setSettings(await settingsRes.json());
        } catch (err) {
          setError(err?.message || String(err));
          setApiConfig(null);
          setSettings(null);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { load(siteBase); }, []);

      return e('main', { className: 'container' },
        e('div', { className: 'topbar' },
          e('a', { className: 'btn-link', href: './dashboard.html' }, '← Dashboard'),
          e('a', { className: 'btn-link', href: '../index.html' }, 'Página inicial')
        ),
        e('header', null,
          e('h1', null, 'Frame-Generator-API · Integração React (navegador)'),
          e('p', null, 'Demonstração React integrada que executa diretamente no navegador via módulos ES (CDN), sem etapa de build. Consome configurações e contrato público do site estático.'),
          e('div', { className: 'notice' }, 'Execução no navegador: esta página roda como módulo ES estático. Para desenvolvimento com JSX/build/deploy (Vite + GitHub Pages), use os fontes embutidos no dashboard (Integração/Discord & Projetos) como referência.')
        ),
        e('section', { className: 'card' },
          e('h2', null, 'Origem dos dados (estático / GitHub Pages)'),
          e('label', { htmlFor: 'siteBase' }, 'URL base do site'),
          e('div', { className: 'row' },
            e('input', { id: 'siteBase', value: siteBase, onChange: (ev) => setSiteBase(ev.target.value), placeholder: 'https://usuario.github.io/repositorio/' }),
            e('button', { onClick: () => load(siteBase), disabled: loading }, loading ? 'Carregando…' : 'Recarregar')
          ),
          error ? e('p', { className: 'error', role: 'alert' }, 'Erro: ' + error) : null
        ),
        e('section', { className: 'grid' },
          e('article', { className: 'card' },
            e('h2', null, 'Contrato de API (lógico)'),
            apiConfig
              ? e(React.Fragment, null,
                  e('p', null, e('strong', null, 'Base: '), e('code', null, apiConfig.base || '/api/v1'), ' · ', e('strong', null, 'Modo: '), apiConfig.mode || 'demo'),
                  e('p', { className: 'muted' }, 'Namespaces declarados: ' + ((apiConfig.namespaces || []).length)),
                  e('pre', null, JSON.stringify(apiConfig, null, 2))
                )
              : e('p', { className: 'muted' }, 'Sem dados carregados.')
          ),
          e('article', { className: 'card' },
            e('h2', null, 'Configurações do sistema'),
            settings
              ? e(React.Fragment, null,
                  e('p', null, e('strong', null, 'Projeto: '), (settings?.system?.name || '—'), ' · ', e('strong', null, 'Versão: '), (settings?.system?.version || '—')),
                  e('pre', null, JSON.stringify(settings, null, 2))
                )
              : e('p', { className: 'muted' }, 'Sem dados carregados.')
          )
        ),
        e('footer', { className: 'muted' },
          e('p', null, 'Integração cliente: para WebSocket/REST autenticados use código/token fornecido em tempo de execução e backend seguro quando aplicável. Inferência/processamento pesado dependem de runtime/provedor compatível.')
        )
      );
    }

    createRoot(document.getElementById('root')).render(e(React.StrictMode, null, e(App)));
  </script>
</body>
</html>
